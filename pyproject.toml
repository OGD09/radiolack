[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "radiolack"
dynamic = ["version"]
description = "Receive-only SDR receiver with a web interface in a desktop window."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.8", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
# Browser tests (tests/test_browser.py). Pinned: each Playwright version comes
# with its own builds of the browsers.
browser = ["playwright==1.64.1"]

[project.scripts]
radiolack = "radiolack.cli:main"

[tool.setuptools.dynamic]
version = {attr = "radiolack.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radiolack = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
