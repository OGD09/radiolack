# Historical airband profile migrated from the pc_repair prototype.
#
# It explores 118 MHz (inclusive) to 137 MHz (exclusive) in AM with an
# 8 kHz filter and snaps peaks to an 8.333 kHz carrier grid starting at
# 118.000 MHz (25 kHz channels are a subset of that grid). These values
# reproduce the prototype; they are not a verified regional band plan.

name = "airband-8k33"
description = "VHF airband 118-137 MHz, AM 8 kHz, 8.333 kHz carrier grid (historical prototype profile)"

[band]
low_hz = 118_000_000
high_hz = 137_000_000          # exclusive

[demodulation]
mode = "AM"
filter_hz = 8_000

[channels]
origin_hz = 118_000_000
spacing_hz = "25000/3"         # exact 8333.33 Hz carrier spacing
snap_tolerance_hz = 3_000

[detection]
margin_db = 15.0
confirm_observations = 2

[listening]
seconds = 10.0
min_active_seconds = 1.0
min_observed_seconds = 5.0
cooldown_seconds = 20.0

[exploration]
window_seconds = 1.0
initial_center_hz = 136_500_000
