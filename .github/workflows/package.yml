# Debian package, on every push to main and pull request that changes the
# package or its packaging, and for each release (release.yml): builds the
# package twice and compares the builds, byte for byte, and puts it in an APT
# repository signed with a throwaway key (packaging/apt_repository.py); then,
# on each supported release of Debian and Ubuntu, installs it with apt from
# that repository, checks the APT source that it adds, runs it
# (packaging/smoke_test.py), removes and purges it, and on Debian 13 checks
# it with lintian. No secrets, services or radio hardware.
name: Package

on:
  push:
    branches: [main]
    paths:
      - "src/radiolack/**"
      - "packaging/**"
      - ".github/workflows/package.yml"
  pull_request:
    paths:
      - "src/radiolack/**"
      - "packaging/**"
      - ".github/workflows/package.yml"
  workflow_call:
    outputs:
      sha256:
        description: SHA-256 of the package in the debian-package artifact, as the build computed it
        value: ${{ jobs.build.outputs.sha256 }}
      dpkg:
        description: Version of the dpkg-deb that built the package
        value: ${{ jobs.build.outputs.dpkg }}

permissions:
  contents: read

# A literal prefix: in a called workflow, github.workflow names the caller.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    # A fixed release: the package's bytes depend on its dpkg-deb.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
      dpkg: ${{ steps.build.outputs.dpkg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The maintainer: the repository's DEB_MAINTAINER variable, or else the
      # owner's GitHub no-reply address.
      - name: Build the package twice and compare the builds
        id: build
        timeout-minutes: 5
        env:
          DEB_MAINTAINER: ${{ vars.DEB_MAINTAINER || format('{0} <{1}+{0}@users.noreply.github.com>', github.repository_owner, github.repository_owner_id) }}
        run: |
          first=$(python3 packaging/build_deb.py --maintainer "$DEB_MAINTAINER" --output "$RUNNER_TEMP/first")
          second=$(python3 packaging/build_deb.py --maintainer "$DEB_MAINTAINER" --output "$RUNNER_TEMP/second")
          cmp "$first" "$second"
          name=$(basename "$first")
          mkdir "$RUNNER_TEMP/dist"
          cp "$first" "$RUNNER_TEMP/dist/"
          cd "$RUNNER_TEMP/dist"
          sha256sum "$name" > SHA256SUMS
          sha256=$(cut -d ' ' -f 1 SHA256SUMS)
          dpkg=$(dpkg-deb --version | sed -n '1s/.* version \([^ ]*\) .*/\1/p')
          dpkg-deb --info "$name"
          dpkg-deb --contents "$name"
          echo "$name: two identical builds, SHA-256 $sha256, dpkg-deb $dpkg"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "dpkg=$dpkg" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-package
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 14

      # Signed as the published repository is, with a key made for this run:
      # its secret part stays on the runner, which forgets it.
      - name: Put the package in a test APT repository
        timeout-minutes: 2
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --pinentry-mode loopback --passphrase '' \
            --quick-generate-key 'Radiolack test repository' ed25519 cert 1d
          key=$(gpg --batch --with-colons --list-keys | awk -F: '/^fpr:/ { print $10; exit }')
          gpg --batch --quiet --pinentry-mode loopback --passphrase '' --quick-add-key "$key" ed25519 sign 1d
          mkdir "$RUNNER_TEMP/apt"
          gpg --batch --export "$key" > "$RUNNER_TEMP/apt/keyring.gpg"
          python3 packaging/apt_repository.py --key "$key" "$RUNNER_TEMP/apt/repository" "$RUNNER_TEMP"/dist/*.deb
          gpgconf --kill all
          find "$RUNNER_TEMP/apt" -type f | sort

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-apt-repository
          path: ${{ runner.temp }}/apt/
          if-no-files-found: error
          retention-days: 14

  install:
    name: Install on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ${{ matrix.image }}
    strategy:
      # Finish every release so a failure shows whether it is release-specific.
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:24.04", "ubuntu:26.04"]
        include:
          - image: "debian:13"
            lintian: true
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # For packaging/smoke_test.py; without git in the image, a download.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debian-package
          path: dist

      # Where apt's _apt user can read it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-apt-repository
          path: /srv/radiolack-apt

      - name: Check the package's checksum
        timeout-minutes: 1
        run: cd dist && sha256sum --check --strict SHA256SUMS

      # The images delete what apt downloads: keep it for the cache, one per
      # image and week. apt checks a cached package against the release's
      # signed indexes before it installs it.
      - name: Keep the packages apt downloads
        id: apt
        timeout-minutes: 1
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/90keep-downloads
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ matrix.image }}-${{ steps.apt.outputs.week }}
          restore-keys: apt-${{ matrix.image }}-

      # As from the published repository: apt checks the signature, and the
      # index must list the package that the build made. Its dependencies
      # only: what the package needs must be in Depends.
      - name: Install the package from the test APT repository, and Xvfb for the window's check
        timeout-minutes: 10
        run: |
          printf '%s\n' 'Types: deb' 'URIs: file:/srv/radiolack-apt/repository/' 'Suites: stable' \
            'Components: main' 'Signed-By: /srv/radiolack-apt/keyring.gpg' \
            > /etc/apt/sources.list.d/radiolack-test.sources
          apt-get -o Acquire::Retries=3 update
          apt-cache policy radiolack
          listed=$(apt-cache show radiolack | sed -n 's/^SHA256: //p')
          built=$(cut -d ' ' -f 1 dist/SHA256SUMS)
          if [ "$listed" != "$built" ]; then
            echo "::error::the test repository lists $listed, not the package that the build made, $built"
            exit 1
          fi
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends radiolack xvfb xauth
          apt-get autoclean

      # Read, not fetched: the published repository is not this run's.
      - name: Check that apt reads the APT source that the package adds
        timeout-minutes: 2
        run: |
          url=$(sed -n 's/^URIs: //p' /etc/apt/sources.list.d/radiolack.sources)
          if ! apt-get update --print-uris | grep -F "'${url}dists/stable/InRelease'"; then
            echo "::error::apt does not read the source that the package adds, for ${url:-no address}"
            exit 1
          fi

      - name: Run the installed package
        timeout-minutes: 5
        env:
          NO_AT_BRIDGE: "1"     # no accessibility bus in a container
        run: |
          dpkg --status radiolack | grep '^Version:'
          if [ -z "$(find /usr/lib/python3/dist-packages/radiolack -name '*.pyc' -print -quit)" ]; then
            echo "::error::the package's maintainer script did not compile its Python files"
            exit 1
          fi
          xvfb-run -a python3 packaging/smoke_test.py --window

      # Removing it keeps its configuration files, the APT source and the key
      # that the source needs; purging it removes them.
      - name: Remove the package, then purge it
        timeout-minutes: 5
        run: |
          apt-get remove -y radiolack
          for path in /usr/bin/radiolack /usr/lib/python3/dist-packages/radiolack; do
            if [ -e "$path" ]; then
              echo "::error::$path is left after the package's removal"
              exit 1
            fi
          done
          for path in /etc/apt/sources.list.d/radiolack.sources /etc/apt/keyrings/radiolack-archive-keyring.gpg; do
            if [ ! -f "$path" ]; then
              echo "::error::the package's removal took $path, which its APT source needs"
              exit 1
            fi
          done
          apt-get purge -y radiolack
          if dpkg --status radiolack > /dev/null 2>&1; then
            echo "::error::dpkg still knows radiolack after its purge"
            exit 1
          fi
          for path in /usr/bin/radiolack /usr/lib/python3/dist-packages/radiolack /usr/share/doc/radiolack \
              /etc/apt/sources.list.d/radiolack.sources /etc/apt/keyrings/radiolack-archive-keyring.gpg; do
            if [ -e "$path" ]; then
              echo "::error::$path is left after the package's purge"
              exit 1
            fi
          done

      # Also after a failed step, for its findings.
      - name: Check the package with lintian
        if: ${{ matrix.lintian && !cancelled() }}
        timeout-minutes: 10
        run: |
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends lintian
          lintian --version
          lintian --allow-root --fail-on error,warning --display-info --info dist/*.deb
