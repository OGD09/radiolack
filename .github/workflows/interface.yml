# Interface checks, when the package, the tests or this file change, and for
# each release (release.yml): the type check of the interface's JavaScript,
# and the browser tests, which drive the interface in headless Chromium,
# Firefox and WebKit (Playwright) against a server on the runner. No secrets,
# services or radio hardware.
name: Interface

on:
  push:
    branches: [main]
    paths:
      - "src/radiolack/**"
      - "tests/**"
      - "jsconfig.json"
      - "pyproject.toml"
      - ".github/workflows/interface.yml"
  pull_request:
    paths:
      - "src/radiolack/**"
      - "tests/**"
      - "jsconfig.json"
      - "pyproject.toml"
      - ".github/workflows/interface.yml"
  workflow_call:

permissions:
  contents: read

# A literal prefix: in a called workflow, github.workflow names the caller.
concurrency:
  group: interface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TYPESCRIPT_VERSION: "7.0.2"     # as in README.md and AGENTS.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # npx keeps the TypeScript it downloads in ~/.npm.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-typescript-${{ env.TYPESCRIPT_VERSION }}

      - name: Check the interface's types
        timeout-minutes: 3
        run: npx --yes --package="typescript@${TYPESCRIPT_VERSION}" -- tsc -p jsconfig.json

  browsers:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # pyproject.toml pins Playwright's version (the "browser" extra), and
      # with it the browsers' builds.
      - name: Install the package and Playwright
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check --no-input ".[browser]"

      # Not cached, as Playwright advises: restoring the browsers takes about
      # as long as downloading them, and a cache could outlive the runner's
      # system.
      - name: Download the browsers
        timeout-minutes: 5
        run: python -m playwright install --only-shell chromium firefox webkit

      # The runners' Ubuntu mirror is at times very slow (about 100 kB/s,
      # while the other downloads run at full speed): its 139 MB of packages
      # then outlast the step below. So the packages are cached, one set per
      # runner image, and a newer image starts from the previous set.
      - name: Name the runner image
        id: image
        timeout-minutes: 1
        run: |
          echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
          echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}-${{ hashFiles('pyproject.toml', '.github/workflows/interface.yml') }}
          restore-keys: apt-${{ steps.image.outputs.os }}-

      # Xvfb gives headless Firefox the display it needs for WebGL2 on a
      # runner without a GPU (FIREFOX_PREFS in tests/test_browser.py), and
      # PulseAudio the sound output it needs for audio on a runner without a
      # sound card. apt takes the cached packages instead of downloading
      # them, then the current ones are kept for the next runs.
      - name: Install the browsers' system libraries, Xvfb and PulseAudio
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          mkdir -p ~/apt-archives
          sudo find ~/apt-archives -name '*.deb' -exec cp -t /var/cache/apt/archives {} +
          python -m playwright install-deps chromium firefox webkit
          sudo -E apt-get install -y --no-install-recommends xvfb xauth pulseaudio
          sudo apt-get autoclean
          rm -rf ~/apt-archives
          mkdir ~/apt-archives
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-archives {} +
          echo "$(ls ~/apt-archives | wc -l) packages kept for the next runs"

      # Only a null sink, a silent output paced like a sound card: without a
      # sound server, Firefox keeps the interface's audio context suspended.
      - name: Start a sound server with a silent output
        timeout-minutes: 1
        run: |
          pulseaudio --start --exit-idle-time=-1 -n --load=module-native-protocol-unix --load=module-null-sink
          pactl info

      # Only the browser tests: the Tests workflow runs the others.
      - name: Run the browser tests
        timeout-minutes: 5
        env:
          RADIOLACK_BROWSER_TESTS: "1"
        run: xvfb-run -a python -m unittest tests.test_browser -v
