# Interface checks, only when the package, the tests or this file change:
# the type check of the interface's JavaScript, and the browser tests, which
# drive the interface in headless Chromium, Firefox and WebKit (Playwright)
# against a server on the runner. No secrets, services or radio hardware.
name: Interface

on:
  push:
    branches: [main]
    paths:
      - "src/radiolack/**"
      - "tests/**"
      - "jsconfig.json"
      - "pyproject.toml"
      - ".github/workflows/interface.yml"
  pull_request:
    paths:
      - "src/radiolack/**"
      - "tests/**"
      - "jsconfig.json"
      - "pyproject.toml"
      - ".github/workflows/interface.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TYPESCRIPT_VERSION: "7.0.2"     # as in README.md and AGENTS.md
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # npx keeps the TypeScript it downloads in ~/.npm.
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-typescript-${{ env.TYPESCRIPT_VERSION }}

      - name: Check the interface's types
        timeout-minutes: 3
        run: npx --yes --package="typescript@${TYPESCRIPT_VERSION}" -- tsc -p jsconfig.json

  browsers:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # pyproject.toml pins Playwright's version (the "browser" extra), and
      # with it the browsers' builds.
      - name: Install the package and Playwright
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check --no-input ".[browser]"

      # Not cached, as Playwright advises: restoring the browsers takes about
      # as long as downloading them, and a cache could outlive the runner's
      # system.
      - name: Download the browsers
        timeout-minutes: 5
        run: python -m playwright install --only-shell chromium firefox webkit

      - name: Install the browsers' system libraries
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: python -m playwright install-deps chromium firefox webkit

      # Only the browser tests: the Tests workflow runs the others.
      - name: Run the browser tests
        timeout-minutes: 5
        env:
          RADIOLACK_BROWSER_TESTS: "1"
        run: python -m unittest tests.test_browser -v
