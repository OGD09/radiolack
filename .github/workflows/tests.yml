# Hardware-free test suite: every push to main, every pull request and each
# release (release.yml) installs the package and runs the unittest suite
# against it, on the oldest supported Python and on the newest stable one. No
# secrets, services or radio hardware.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A literal prefix: in a called workflow, github.workflow names the caller.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Finish both versions so a failure shows whether it is version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check --no-input .

      # No PYTHONPATH: the tests import the installed package, which also
      # checks that the interface files ship with it.
      - name: Run the tests
        timeout-minutes: 5
        run: python -m unittest discover -s tests -t . -v
